name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-dotnet:
    name: Test .NET Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0'
      
      - name: Restore Dependencies
        run: dotnet restore ./BlazorAppFront/BlazorAppFront.csproj
      
      - name: Run Tests
        run: dotnet test --no-build --verbosity normal ./BlazorAppFront/BlazorAppFront.csproj

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test-dotnet
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Docker Image
        run: docker build -t myapp:${{ github.sha }} ./BlazorAppFront/
      
      - name: Push Docker Image
        run: docker push myapp:${{ github.sha }}

  deploy-server:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull myapp:${{ github.sha }}
            docker stop myapp || true
            docker rm myapp || true
            docker run -d --name myapp -p 88:80 myapp:${{ github.sha }}

  notify:
    name: Notify User
    runs-on: ubuntu-latest
    needs: deploy-server
    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp@gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD Pipeline Result"
          body: "Pipeline completed. Status: ${{ job.status }}."
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: ${{ secrets.EMAIL_USER }}
