name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-dotnet:
    name: Test .NET Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0'

      - name: Restore Dependencies
        run: dotnet restore ./BlazorAppFront/BlazorAppFront.csproj

      - name: Run Tests
        run: |
          dotnet test --no-build --verbosity normal ./BlazorAppFront/BlazorAppFront.csproj || echo "Test failed" > test-error.log
        continue-on-error: true
        

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test-dotnet
    steps:
      - name: Setup Proxy
        run: |
          echo "http_proxy=http://192.168.113.34:8080" >> /etc/environment
          echo "https_proxy=http://192.168.113.34:8080" >> /etc/environment
          echo "no_proxy=localhost,127.0.0.1,192.168.19.8 >> /etc/environment
          export http_proxy=http://192.168.113.34:8080
          export https_proxy=http://192.168.113.34:8080
          export no_proxy=localhost,127.0.0.1,192.168.19.8
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t docker.io/${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }} ./BlazorAppFront/
      
      - name: Push Docker Image
        run: docker push docker.io/${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}

  deploy-server:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
    - name: Setup Proxy for SSH
      run: |
        echo "ProxyCommand nc -X connect -x http://192.168.113.34:8080 %h %p" >> ~/.ssh/config
        echo "Host *" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        
    - name: Setup SSH Agent
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa

    - name: SSH to server
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: /home/runner/.ssh/id_rsa
        port: 22
        script: |
          echo "Connected successfully"
        sync: false
        use_insecure_cipher: false
        timeout: 60s  # Увеличен таймаут
        command_timeout: 10m
        debug: true  

    - name: Run commands on remote server
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          docker pull myapp:${{ github.sha }}
          docker stop myapp || true
          docker rm myapp || true
          docker run -d --name myapp -p 8088:80 myapp:${{ github.sha }}
        sync: false
        use_insecure_cipher: false
        timeout: 60s 
        command_timeout: 10m
        debug: true 

  notify:
    name: Notify User
    runs-on: ubuntu-latest
    needs: [test-dotnet, build-docker, deploy-server]
    if: always()
    steps:
      - name: Send Success Email
        if: ${{ needs.test-dotnet.result == 'success' && needs.build-docker.result == 'success' && needs.deploy-server.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD Pipeline Completed Successfully"
          body: |
            Pipeline completed successfully.
            All jobs succeeded:
            - Test .NET Code
            - Build and Push Docker Image
            - Deploy to Server
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: GitHub <no-reply@github.com>
          
      - name: Send Failure Email
        if: ${{ needs.test-dotnet.result != 'success' || needs.build-docker.result != 'success' || needs.deploy-server.result != 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD Pipeline Failed"
          body: |
           Pipeline failed. Check the following jobs:
            - Test .NET Code: ${{ needs.test-dotnet.result }}
            - Build and Push Docker Image: ${{ needs.build-docker.result }}
            - Deploy to Server: ${{ needs.deploy-server.result }}
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: ${{ secrets.EMAIL_SENDER }}
