name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-dotnet:
    name: Test .NET Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0'

      - name: Restore Dependencies
        run: dotnet restore ./BlazorAppFront/BlazorAppFront.csproj

      - name: Run Tests
        run: |
          dotnet test --no-build --verbosity normal ./BlazorAppFront/BlazorAppFront.csproj || echo "Test failed" > test-error.log
        continue-on-error: true
        id: test-dotnet

      - name: Set test-dotnet error output
        run: |
          if [ -f test-error.log ]; then
            echo "::set-output name=error::$(cat test-error.log)"
          else
            echo "::set-output name=error::No errors"
          fi

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test-dotnet
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t docker.io/${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }} ./BlazorAppFront/
          docker images || echo "Docker build failed" > build-error.log
        id: build-docker

      - name: Push Docker Image
        run: docker push docker.io/${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}

  deploy-server:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Setup SSH Agent
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: SSH to server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Connected successfully"
          sync: false
          use_insecure_cipher: false
          timeout: 30s
          command_timeout: 10m
          debug: true || echo "SSH connection failed" > ssh-error.log
        id: deploy-server


      - name: Run commands on remote server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            docker pull myapp:${{ github.sha }}
            docker stop myapp || true
            docker rm myapp || true
            docker run -d --name myapp -p 8088:80 myapp:${{ github.sha }} || echo "Docker run failed" > docker-run-error.log

  notify:
    name: Notify User
    runs-on: ubuntu-latest
    needs: [test-dotnet, build-docker, deploy-server]
    if: always()
    steps:
      - name: Set Output for Test .NET Logs
        id: test-dotnet-logs
        run: echo "::set-output name=logs::$(cat $GITHUB_WORKSPACE/test-output.log)"
        if: failure()

      - name: Set Output for Build Docker Logs
        id: build-docker-logs
        run: echo "::set-output name=logs::$(cat $GITHUB_WORKSPACE/build-output.log)"
        if: failure()

      - name: Set Output for Deploy Server Logs
        id: deploy-server-logs
        run: echo "::set-output name=logs::$(cat $GITHUB_WORKSPACE/deploy-output.log)"
        if: failure()

        
      - name: Send Success Email
        if: ${{ needs.test-dotnet.result == 'success' && needs.build-docker.result == 'success' && needs.deploy-server.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD Pipeline Completed Successfully"
          body: |
            Pipeline completed successfully.
            All jobs succeeded:
            - Test .NET Code
            - Build and Push Docker Image
            - Deploy to Server
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: GitHub <no-reply@github.com>
          
      - name: Send Failure Email
        if: ${{ needs.test-dotnet.result != 'success' || needs.build-docker.result != 'success' || needs.deploy-server.result != 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD Pipeline Failed"
          body: |
           Pipeline failed.
            Check the following jobs:
            - Test .NET Code: ${{ needs.test-dotnet.result }}
            - Build and Push Docker Image: ${{ needs.build-docker.result }}
            - Deploy to Server: ${{ needs.deploy-server.result }}
            - Logs:
              Test .NET Code Job Logs: ${{ steps.test-dotnet.outputs.logs }}
              Build Docker Job Logs: ${{ steps.build-docker.outputs.logs }}
              Deploy Server Job Logs: ${{ steps.deploy-server.outputs.logs }}
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: GitHub <no-reply@github.com>
